[profile.default]
src = "src"
out = "out"
libs = ["lib"]

# Pin one compiler version for both Foundry and the VS Code Solidity extension.
# This prevents the old 0.5.11 parser from being used by mistake.
solc = "0.8.28"
optimizer = true
optimizer_runs = 200

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
